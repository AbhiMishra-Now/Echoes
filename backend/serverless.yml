service: echoes-backend

useDotenv: true

provider:
  name: aws
  runtime: python3.12
  architecture: arm64
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    AWS_REGION: ${env:AWS_REGION, 'us-east-1'}
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE, 'echoes_biographies'}
    S3_BUCKET: ${env:S3_BUCKET, 'echoes-media-bucket-ak-sg'}
    REPLICATE_API_TOKEN: ${env:REPLICATE_API_TOKEN}
    REPLICATE_MODEL: ${env:REPLICATE_MODEL, 'deepseek-ai/deepseek-r1'}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    BACKEND_CORS_ORIGINS: '["*"]'

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:*
            - s3:*
          Resource: "*"

functions:
  api:
    handler: handler.handler
    url:
      cors: true
